name: Release build

# On a version tag: build on each platform, then attach the compiled library to the GitHub
# release of that tag. Packages that depend on this one at a tagged commit download it
# instead of compiling (`preferReleaseBuild = true` in lakefile.toml). Lake names the archive
# after the platform, so each platform needs a build of its own. Dependencies with release
# builds of their own are downloaded here too.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Create the release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --verify-tag --generate-notes

  build:
    name: Build (${{ matrix.os }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        # x86_64 Linux and arm64 macOS.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs elan, downloads the Mathlib cache and runs `lake build`.
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          lint: false
          test: false
          use-github-cache: false

      - name: Upload the build to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: lake upload "$TAG"
