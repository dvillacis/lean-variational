name: Release build

# On a version tag: build, then attach the compiled library to the GitHub release of that tag.
# Packages that depend on this one at a tagged commit download it instead of compiling
# (`preferReleaseBuild = true` in lakefile.toml). Dependencies with release builds of their
# own are downloaded here too.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Mathlib cache
        run: lake exe cache get

      - name: Build
        run: lake build

      - name: Upload the build to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --verify-tag \
              --notes "Compiled library for Lake (preferReleaseBuild). Built on Linux by the Release build workflow."
          lake upload "$TAG"
